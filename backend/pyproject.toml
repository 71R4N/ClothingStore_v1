[tool.poetry]
name = "catvton-shop"
version = "0.1.0"
description = "Clothing store with virtual try-on"
packages = [{ include = "app" }]
authors = ["You <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
gradio-client = "^1.0.0"
uvicorn = "^0.30.0"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"   # для синхронных миграций
alembic = "^1.13.0"
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"
redis = "^5.0.0"
celery = "^5.3.0"
httpx = "^0.27.0"             # для внешних API (Т-банк)
passlib = "^1.7.4"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.1.0"
python-multipart = "^0.0.9"   # для загрузки файлов
pillow = "^10.2.0"            # обработка изображений
aiofiles = "^23.2.1"          # асинхронная работа с файлами

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
faker = "^24.0.0"
aiosqlite = "^0.22.1"
respx = "^0.23.1"
pytest-cov = "^7.1.0"

[tool.poetry.scripts]
start-backend = "uvicorn backend.app.main:app --reload --host 0.0.0.0 --port 8000"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]          # ← КРИТИЧНО: добавляет backend/ в sys.path
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "alembic/*",
    "worker/*",
    "app/initial_data.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]