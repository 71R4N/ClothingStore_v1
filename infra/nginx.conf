# infra/nginx.conf
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 20M;

    server {
        listen 80;

        # ===== ПРОКСИРОВАНИЕ АДМИН-ПАНЕЛИ SQLAdmin =====
        # Должно быть ВЫШЕ location /api/, чтобы перехватывать /admin/*
        location /admin {
            proxy_pass http://backend:8000/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Важно для корректной работы form submission и редиректов SQLAdmin
            proxy_redirect off;

            # Поддержка WebSocket (если потребуется для будущих функций)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ===== API Backend =====
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # ===== Статические файлы =====
        location /static/uploads/ {
            alias /usr/share/nginx/html/static/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /static/tryon_results/ {
            alias /usr/share/nginx/html/static/tryon_results/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location /images/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ===== SPA Frontend (должен быть ПОСЛЕДНИМ!) =====
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}