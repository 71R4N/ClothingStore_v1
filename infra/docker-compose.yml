version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clothing_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../ml_models:/app/ml_models   # для локального доступа к модели (опционально)
    command: uvicorn backend.app.main:app --reload --host 0.0.0.0 --port 8000

  # Celery worker (позже)
  # worker:
  #   build:
  #     context: ../backend
  #   command: celery -A backend.worker.celery_app worker --loglevel=info
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     - redis
  #     - db
  #   volumes:
  #     - ../backend:/app

volumes:
  postgres_data:
  redis_data: